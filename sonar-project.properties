# SonarQube Cloud analysis, run by the "sonar" job in .github/workflows/deploy.yml.
# Keys confirmed by SonarQube Cloud's setup for this repository.
sonar.organization=tabskey
sonar.projectKey=tabskey_nekodoku

sonar.sources=src
sonar.tests=src
# Tests and their helpers are analyzed as tests, not as source; assets are not code.
sonar.test.inclusions=src/**/*.test.ts,src/test/**
sonar.exclusions=src/**/*.test.ts,src/test/**,src/assets/**
sonar.sourceEncoding=UTF-8

# Written by `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
