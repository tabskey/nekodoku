# SonarQube Cloud analysis, run by the "sonar" job in .github/workflows/deploy.yml.
# Keys confirmed by SonarQube Cloud's setup for this repository.
sonar.organization=tabskey
sonar.projectKey=tabskey_nekodoku

sonar.sources=src
sonar.tests=src
# Tests and their helpers are analyzed as tests, not as source; assets are not code.
sonar.test.inclusions=src/**/*.test.ts,src/test/**
sonar.exclusions=src/**/*.test.ts,src/test/**,src/assets/**
sonar.sourceEncoding=UTF-8

# Written by `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is required where the rules live: src/game, src/storage and the
# reducers. Screens and browser glue are still analyzed for bugs and security,
# but are not counted for coverage; see "Testing" in docs/ARCHITECTURE.md.
sonar.coverage.exclusions=\
  src/components/**,\
  src/pages/**,\
  src/i18n/**,\
  src/App.tsx,\
  src/main.tsx,\
  src/state/ProfileProvider.tsx,\
  src/state/profileContext.ts,\
  src/state/usePuzzle.ts,\
  src/state/puzzle.worker.ts,\
  src/state/useLevelTimer.ts
